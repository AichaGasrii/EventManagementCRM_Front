<div class="container">
  <div class="text-center">
    <a [routerLink]="'/organizer/venueDetails/' + venueId + '/addEquipment/' + venueId">
      <button type="button" class="btn btn-outline-success mb-2">Add Equipment</button>
    </a>
  </div>

  <table class="table table-striped">
    <thead>
      <tr class="text-center">
        <th>#</th>
        <th>Image</th>
        <th>Name</th>
        <th>Cost</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr class="text-center" *ngFor="let equipment of equipments; let i = index">
        <td>{{ i + 1 }}</td>
        <td><img [src]="'assets/images/' + getImageFileName(equipment.imagePath)" alt="{{ equipment.equipmentName }}" style="width: 100px; height: auto;"></td>
        <td>{{ equipment.equipmentName }}</td>
        <td>{{ equipment.equipmentCost }}</td>
        <td>
          <a [routerLink]="'/organizer/venueDetails/' + venueId + '/updateEquipment/' + equipment.equipmentId" class="btn btn-outline-warning">
            Update
          </a>
          <a (click)="deleteEquipment(equipment.equipmentId)" class="btn btn-outline-danger">
            Delete
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
