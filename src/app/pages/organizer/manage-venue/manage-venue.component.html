<body>
  <div class="card">
    <div class="card-body">
       <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item">
              <a routerLink="/organizer" routerLinkActive="router-link-active">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Manage</li>
          </ol>
        </nav>
    </div>

<div class="container">
  <div>
    <h4 class="text-center">Manage Your Venues</h4>
    <div class="row justify-content-end">
      <div class="col-auto">
        <a routerLink="/organizer/addVenue">
          <button type="button" class="btn btn-outline-success mb-2">ADD VENUE</button>
        </a>
      </div>
    </div>
  </div>

  <table  class="table table-striped">
    <thead class="table-dark">
      <tr class="text-center">
        <th>Image</th> <!-- Add this line -->
        <th>Name</th>
        <th>Place</th>
        <th>Contact</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr class="text-center" *ngFor="let venue of venues">
        <td><img [src]="'assets/images/'+getImageFileName(venue.imagePath)" alt="{{ venue.venueName }}" style="width: 100px; height: auto;"></td>
        <td>{{venue.venueName}}</td>
        <td>{{venue.venuePlace}}</td>
        <td>{{venue.venueContact}}</td>
        <!-- Add this line -->
        <td>
          <a [routerLink]="'/organizer/venueDetails/' + venue.venueId" class="btn btn-primary" >
            <i class="fa fa-eye"  >   </i>
          </a>
          <a (click)="deleteVenue(venue.venueId)"  class="btn btn-danger" >
            <i class="fa fa-trash"></i>
          </a>
          </td>
      </tr>
    </tbody>
  </table>
</div>
</div>

<!-- Javascripts -->
<script src="../../assets/plugins/jquery/jquery-3.5.1.min.js"></script>
<script src="../../assets/plugins/bootstrap/js/popper.min.js"></script>
<script src="../../assets/plugins/bootstrap/js/bootstrap.min.js"></script>
<script src="../../assets/plugins/perfectscroll/perfect-scrollbar.min.js"></script>
<script src="../../assets/plugins/pace/pace.min.js"></script>
<script src="../../assets/plugins/highlight/highlight.pack.js"></script>
<script src="../../assets/plugins/datatables/datatables.min.js"></script>
<script src="../../assets/js/main.min.js"></script>
<script src="../../assets/js/custom.js"></script>
<script src="../../assets/js/pages/datatables.js"></script>
</body>
